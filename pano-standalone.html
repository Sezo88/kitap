<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dijital Pano</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.18);
      --header: rgba(0, 0, 0, 0.3);
      --text: #fff;
      --gold: #FFD700;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      transition: background .5s
    }
    ::-webkit-scrollbar { display: none }
    * { scrollbar-width: none; -ms-overflow-style: none }

    .h {
      grid-area: h;
      display: flex;
      align-items: center;
      background: var(--header);
      backdrop-filter: blur(10px);
      padding: 10px 25px;
      border-radius: 15px;
      gap: 20px
    }
    .h .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 280px
    }
    .h .logo-area img {
      width: 50px; height: 50px; border-radius: 10px; object-fit: cover
    }
    .h .school-name {
      font-size: 1.8em; font-weight: bold
    }
    .h .school-motto {
      font-size: .75em; opacity: .7
    }
    .h .period-center {
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }
    .h .period-center .period-text {
      font-size: 1.4em;
      font-weight: bold;
      color: var(--gold)
    }
    .h .period-center .countdown {
      font-size: 1.6em;
      font-weight: bold;
      font-variant-numeric: tabular-nums
    }
    .h .clock {
      text-align: right;
      min-width: 200px
    }
    .h .clock .time {
      font-size: 2.3em;
      font-weight: bold;
      font-variant-numeric: tabular-nums
    }
    .h .clock .date {
      font-size: .8em; opacity: .8
    }

    .auto-scroll {
      overflow-y: auto;
      scroll-behavior: smooth
    }

    .pano {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-areas: "h h h" "l c r" "f f f";
      grid-template-columns: 1.3fr 2fr 1.3fr;
      grid-template-rows: 80px 1fr 40px;
      gap: 10px;
      padding: 10px
    }

    .h .clock .status {
      font-size: 1em;
      color: var(--gold);
      margin-top: 2px
    }

    .l {
      grid-area: l;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden
    }

    .c {
      grid-area: c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 15px
    }

    .r {
      grid-area: r;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden
    }

    .f {
      grid-area: f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      font-size: .8em
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 15px;
      border: 1px solid var(--border);
      overflow: auto
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.1em
    }

    .card-empty {
      opacity: .6;
      text-align: center;
      padding: 20px;
      font-size: .9em
    }

    .lesson-row,
    .duty-row,
    .bday-row,
    .reader-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: .9em
    }

    .lesson-row .per {
      font-weight: 600;
      min-width: 30px
    }

    .lesson-row .sub {
      flex: 1
    }

    .lesson-row .tch {
      opacity: .7;
      font-size: .85em
    }

    .slide-wrap {
      width: 100%;
      height: 100%;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .slide-wrap img {
      max-width: 60%;
      max-height: 45%;
      border-radius: 12px;
      margin-bottom: 20px;
      object-fit: cover
    }

    .slide-wrap .title {
      font-size: 2.2em;
      font-weight: bold;
      margin-bottom: 10px
    }

    .slide-wrap .content {
      font-size: 1.2em;
      opacity: .85;
      max-width: 80%
    }

    .slide-wrap .cat {
      position: absolute;
      top: 15px;
      right: 20px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: .75em;
      font-weight: 600
    }

    .slide-wrap .dots {
      position: absolute;
      bottom: 15px;
      display: flex;
      gap: 8px
    }

    .slide-wrap .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .3);
      transition: .3s
    }

    .slide-wrap .dots span.active {
      width: 24px;
      background: #fff
    }

    .top-class {
      background: linear-gradient(135deg, rgba(255, 215, 0, .2), rgba(255, 215, 0, .05));
      border: 1px solid rgba(255, 215, 0, .3);
      border-radius: 15px;
      padding: 15px;
      text-align: center
    }

    .top-class .label {
      font-size: .85em;
      opacity: .8
    }

    .top-class .name {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--gold)
    }

    .top-class .avg {
      font-size: .85em;
      opacity: .7
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999
    }

    .login-box {
      background: rgba(255, 255, 255, .15);
      backdrop-filter: blur(20px);
      padding: 40px 50px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, .2);
      text-align: center;
      color: #fff
    }

    .login-box h1 {
      font-size: 28px;
      margin-bottom: 8px
    }

    .login-box p {
      opacity: .8;
      margin-bottom: 24px
    }

    .login-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 22px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .1);
      color: #fff;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
      margin-bottom: 12px
    }

    .login-box .err {
      color: #FFD700;
      font-size: 14px;
      margin-bottom: 12px
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer
    }

    .login-box button:enabled {
      background: #fff;
      color: #667eea
    }

    .login-box button:disabled {
      background: rgba(255, 255, 255, .2);
      color: rgba(255, 255, 255, .5);
      cursor: default
    }

    .gallery-thumb {
      position: fixed;
      bottom: 50px;
      right: 20px;
      width: 280px;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, .2);
      z-index: 100
    }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .gallery-thumb .cap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, .7);
      padding: 4px 10px;
      font-size: .8em
    }

    .offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px
    }

    .offline-dot.on {
      background: #4CAF50
    }

    .offline-dot.off {
      background: #f44336
    }

    @media(max-width:1024px) {
      .pano {
        grid-template-areas: "h" "c" "f";
        grid-template-columns: 1fr;
        grid-template-rows: 70px 1fr 35px
      }

      .l,
      .r {
        display: none
      }
    }
  </style>
</head>

<body>

  <div class="login-overlay" id="login">
    <div class="login-box">
      <h1>Dijital Pano</h1>
      <p>Okul PIN kodunu girin</p>
      <input type="password" inputmode="numeric" maxlength="6" id="pinInput" placeholder="PIN" autofocus>
      <div class="err" id="pinErr"></div>
      <button id="pinBtn">Giriş Yap</button>
    </div>
  </div>

  <div class="pano" id="pano" style="display:none">
    <div class="h">
      <div class="logo-area">
        <img id="logo" src="" style="display:none">
        <div>
          <div class="school-name" id="schoolName"></div>
          <div class="school-motto" id="schoolMotto"></div>
        </div>
      </div>
      <div class="period-center">
        <div class="period-text" id="periodStatus">Ders Dışı</div>
        <div class="countdown" id="periodCountdown"></div>
      </div>
      <div class="clock">
        <div class="time" id="time"></div>
        <div class="date" id="date"></div>
      </div>
    </div>

    <div class="l">
      <div class="card auto-scroll" style="flex:1">
        <h3>Bugünün Ders Programı</h3>
        <div id="lessons">
          <div class="card-empty">Yükleniyor...</div>
        </div>
      </div>
      <div class="card auto-scroll" style="max-height:200px">
        <h3>Bugunun Nöbetçileri</h3>
        <div id="duties">
          <div class="card-empty">Yükleniyor...</div>
        </div>
      </div>
    </div>

    <div class="c auto-scroll" style="overflow-y:auto;padding:5px;display:flex;flex-direction:column;gap:8px;width:100%;align-items:stretch;justify-content:flex-start" id="centerPanel">
      <div style="opacity:.5;font-size:1.2em;text-align:center;padding:40px">Duyuru yukleniyor...</div>
    </div>

    <div class="r">
      <div class="card auto-scroll" style="max-height:150px">
        <h3>Bu Ay Doğanlar</h3>
        <div id="birthdays">
          <div class="card-empty">Yükleniyor...</div>
        </div>
      </div>
      <div class="card auto-scroll" id="topScores" style="max-height:170px">
        <h3>Bu Hafta En Temiz Sınıf</h3>
        <div class="card-empty">Yükleniyor...</div>
      </div>
      <div class="card auto-scroll" style="flex:1">
        <h3>En Çok Kitap Okuyanlar</h3>
        <div id="topReaders">
          <div class="card-empty">Yükleniyor...</div>
        </div>
      </div>
      <div id="topClassBox"></div>
    </div>

    <div class="f">
      <span style="opacity:.9;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" id="quizFooter"></span>
      <span style="opacity:.7;flex-shrink:0;margin-left:15px" id="galleryInfo"></span>
      <span style="flex-shrink:0;margin-left:15px">
        <span class="offline-dot on" id="statusDot"></span>
        <span id="statusText">Canli</span>
      </span>
    </div>
  </div>

  <div class="gallery-thumb" id="galleryThumb" style="display:none">
    <img id="galleryImg" src="" alt="">
    <div class="cap" id="galleryCap"></div>
  </div>

  <script>
    // ═══════════════ CONFIG ═══════════════
    // KITAP Supabase - degistirmeyin!
    const SUPABASE_URL = 'https://cfkyfqmruruwiyffossq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNma3lmcW1ydXJ1d2l5ZmZvc3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDgxOTAsImV4cCI6MjA5Nzg4NDE5MH0.ZjFqPPiZOD6Bw0Ok8wiBfqgSjxYBebXsLayXJSMTw4Y';
    const REFRESH_MIN = 2; // kac dakikada bir kontrol
    const CACHE_KEY = 'pano_data';
    const AUTH_KEY = 'pano_auth';

    const THEMES = {
      blue: 'linear-gradient(135deg,#667eea 0%,#764ba2 100%)',
      green: 'linear-gradient(135deg,#2E7D32 0%,#1B5E20 100%)',
      orange: 'linear-gradient(135deg,#FF9800 0%,#E65100 100%)',
      purple: 'linear-gradient(135deg,#9C27B0 0%,#6A1B9A 100%)',
      red: 'linear-gradient(135deg,#D32F2F 0%,#B71C1C 100%)',
      teal: 'linear-gradient(135deg,#00897B 0%,#00695C 100%)',
      indigo: 'linear-gradient(135deg,#303F9F 0%,#1A237E 100%)',
      pink: 'linear-gradient(135deg,#E91E63 0%,#C2185B 100%)',
      dark: 'linear-gradient(135deg,#424242 0%,#212121 100%)',
      sky: 'linear-gradient(135deg,#0288D1 0%,#01579B 100%)'
    };

    // ═══════════════ STATE ═══════════════
    let schoolId = null;
    let schoolName = '';
    let config = {};
    let allData = null;
    let slideIdx = 0;
    let galleryIdx = 0;
    let slideTimer, galleryTimer, clockTimer, refreshTimer;

    // ═══════════════ INIT ═══════════════
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Auto-login
    const saved = sessionStorage.getItem(AUTH_KEY);
    if (saved) {
      try {
        const d = JSON.parse(saved);
        if (d.expires > Date.now()) { schoolId = d.schoolId; schoolName = d.schoolName; startPano(); }
      } catch (e) { sessionStorage.removeItem(AUTH_KEY); }
    }

    // ═══════════════ LOGIN ═══════════════
    document.getElementById('pinBtn').addEventListener('click', async () => {
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('pinBtn');
      const err = document.getElementById('pinErr');
      if (!pin) return;
      btn.disabled = true; btn.textContent = 'Kontrol ediliyor...'; err.textContent = '';

      const { data } = await sb.from('schools').select('id,name,pano_pin').eq('pano_pin', pin).maybeSingle();
      if (data) {
        schoolId = data.id; schoolName = data.name;
        sessionStorage.setItem(AUTH_KEY, JSON.stringify({ schoolId: data.id, schoolName: data.name, expires: Date.now() + 86400000 }));
        startPano();
      } else {
        err.textContent = 'Gecersiz PIN!';
        btn.disabled = false; btn.textContent = 'Giriş Yap';
      }
    });

    document.getElementById('pinInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('pinBtn').click();
    });

    // ═══════════════ START ═══════════════
    async function startPano() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('pano').style.display = 'grid';
      document.getElementById('schoolName').textContent = schoolName;

      // Cache'ten yukle
      const cached = localStorage.getItem(CACHE_KEY + '_' + schoolId);
      if (cached) {
        try { allData = JSON.parse(cached); renderAll(); } catch (e) { }
      }

      await fetchAll();
      startTimers();
      refreshTimer = setInterval(fetchAll, REFRESH_MIN * 60 * 1000);
    }

    // ═══════════════ FETCH ═══════════════
    async function fetchAll() {
      if (!schoolId) return;
      const today = new Date();
      const dow = today.getDay();
      // Bu haftanin pazartesi ve cumasi
      const d = new Date(today);
      const dayOfWeek = d.getDay();
      const diffMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      d.setDate(d.getDate() + diffMon);
      const weekMon = d.toISOString().split('T')[0];
      d.setDate(d.getDate() + 4);
      const weekFri = d.toISOString().split('T')[0];

      try {
        const [
          { data: cfg }, { data: bells }, { data: lessons }, { data: duties },
          { data: ann }, { data: gal }, { data: bdays }, { data: readers }, { data: classesData },
          { data: rawScores }, { data: dailyQuiz }, { data: quizScores }
        ] = await Promise.all([
          sb.from('panel_config').select('*').eq('school_id', schoolId).maybeSingle(),
          sb.from('bell_schedule').select('*').eq('school_id', schoolId).order('period_no'),
          sb.from('lesson_schedule').select('day_of_week,period_no,subjects(name),profiles!lesson_schedule_teacher_id_fkey(full_name),classes(name)').eq('classes.school_id', schoolId).eq('day_of_week', dow).order('period_no'),
          sb.from('duty_schedule').select('day_of_week,location,profiles(full_name)').eq('school_id', schoolId).eq('day_of_week', dow),
          sb.from('panel_announcements').select('*').eq('school_id', schoolId).eq('is_active', true).order('priority', { ascending: false }).order('display_order'),
          sb.from('panel_gallery').select('*').eq('school_id', schoolId).eq('is_active', true).order('display_order'),
          sb.from('students').select('full_name,class_id,dogum_tarihi,classes(name)').eq('school_id', schoolId).eq('is_active', true).not('dogum_tarihi', 'is', null),
          sb.from('student_books').select('student_id,students!inner(full_name,class_id)').eq('status','completed'),
          sb.from('classes').select('id,name').eq('school_id',schoolId),
          sb.from('cleanliness_scores').select('class_id,score,classes!inner(name)').gte('score_date',weekMon).lte('score_date',weekFri),
          sb.from('quiz_daily').select('id,quiz_questions(question,answer)').eq('school_id',schoolId).eq('question_date',today.toISOString().split('T')[0]).maybeSingle(),
          sb.from('quiz_scores').select('score,classes(name)').eq('school_id',schoolId).order('score',{ascending:false}).limit(5)
        ]);

        allData = { cfg, bells, lessons, duties, ann, gal, bdays, readers, classesData, rawScores, dailyQuiz, quizScores, fetchedAt: Date.now() };
        localStorage.setItem(CACHE_KEY + '_' + schoolId, JSON.stringify(allData));
        updateStatus(true);
      } catch (e) {
        updateStatus(false);
      }
      renderAll();
    }

    function updateStatus(online) {
      document.getElementById('statusDot').className = 'offline-dot ' + (online ? 'on' : 'off');
      document.getElementById('statusText').textContent = online ? 'Canli' : 'Cache';
    }

    function getArr(d) { return Array.isArray(d) ? d[0] : d; }

    // ═══════════════ RENDER ═══════════════
    function renderAll() {
      if (!allData) return;
      const { cfg, bells, lessons, duties, ann, gal, bdays, readers, classesData, rawScores, dailyQuiz, quizScores } = allData;

      // Config
      config = cfg || {};
      document.body.style.background = THEMES[config.theme] || THEMES.blue;
      if (config.school_logo_url) { document.getElementById('logo').src = config.school_logo_url; document.getElementById('logo').style.display = 'block'; }
      document.getElementById('schoolMotto').textContent = config.school_motto || '';

      // Lessons
      const lc = document.getElementById('lessons');
      if (lessons && lessons.length) {
        lc.innerHTML = lessons.slice(0, 10).map(l => {
          const s = getArr(l.subjects); const t = getArr(l.profiles);
          return `<div class="lesson-row"><span class="per">${l.period_no}.</span><span class="sub">${s?.name || '-'}</span><span class="tch">${t?.full_name || ''}</span></div>`;
        }).join('');
      } else lc.innerHTML = '<div class="card-empty">Bugun ders yok</div>';

      // Duties
      const dc = document.getElementById('duties');
      if (duties && duties.length) {
        dc.innerHTML = duties.slice(0, 8).map(d => {
          const t = getArr(d.profiles);
          return `<div class="duty-row"><span style="font-weight:600">${t?.full_name || ''}</span><span style="opacity:.7;font-size:.85em">${d.location || d.time_slot || ''}</span></div>`;
        }).join('');
      } else dc.innerHTML = '<div class="card-empty">Nöbetçi yok</div>';

      // Announcements
      renderAnnouncements(ann);
      if (slideTimer) clearInterval(slideTimer);

      // Birthdays
      const now = new Date(); const thisMonth = now.getMonth();
      const bc = document.getElementById('birthdays');
      if (bdays && bdays.length) {
        const monthBdays = bdays.filter(s => s.dogum_tarihi && new Date(s.dogum_tarihi).getMonth() === thisMonth);
        if (monthBdays.length) {
          bc.innerHTML = monthBdays.slice(0, 8).map(b => {
            const cls = getArr(b.classes);
            var d = b.dogum_tarihi ? new Date(b.dogum_tarihi) : null;
            var dateStr = d ? d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' }) : '';
            return `<div class="bday-row"><span>🎂 ${dateStr} - ${b.full_name}</span><span style="opacity:.7;font-size:.85em">${cls?.name || ''}</span></div>`;
          }).join('');
        } else bc.innerHTML = '<div class="card-empty">Bu ay doğum günü yok</div>';
      } else bc.innerHTML = '<div class="card-empty">Veri yok</div>';

      // En Temiz Sınıf (haftalik ilk 3)
      const tsc = document.getElementById('topScores');
      if (rawScores && rawScores.length) {
        const scMap = {};
        rawScores.forEach(s => {
          const cn = getArr(s.classes)?.name; if (!cn) return;
          if (!scMap[cn]) scMap[cn] = { total: 0, count: 0 };
          scMap[cn].total += s.score; scMap[cn].count++;
        });
        const ranked = Object.entries(scMap).map(([name, v]) => ({
          name, avg: Math.round((v.total / v.count) * 10) / 10
        })).sort((a, b) => b.avg - a.avg).slice(0, 3);
        if (ranked.length) {
          tsc.innerHTML = '<h3>Bu Hafta En Temiz Sınıf</h3>' + ranked.map((r, i) =>
            `<div class="reader-row"><span style="font-weight:bold;color:#FFD700;min-width:24px;text-align:center">${i+1}.</span><span style="flex:1">${r.name}</span><span style="font-weight:600">${r.avg} puan</span></div>`
          ).join('');
        } else tsc.innerHTML = '<h3>Bu Hafta En Temiz Sınıf</h3><div class="card-empty">Veri yok</div>';
      } else tsc.innerHTML = '<h3>Bu Hafta En Temiz Sınıf</h3><div class="card-empty">Veri yok</div>';

      // Top Readers
      const trc = document.getElementById('topReaders');
      const classMap = {};
      if (classesData) classesData.forEach(c => { classMap[c.id] = c.name; });

      if (readers && readers.length && config.show_top_readers !== false) {
        const map = new Map();
        readers.forEach(r => {
          const s = getArr(r.students);
          const sid = s?.full_name; if (!sid) return;
          const cid = s?.class_id;
          if (!map.has(sid)) map.set(sid, { student_name: sid, class_name: classMap[cid] || '', book_count: 0 });
          map.get(sid).book_count++;
        });
        const top = Array.from(map.values()).sort((a, b) => b.book_count - a.book_count).slice(0, 7);
        if (top.length) {
          trc.innerHTML = top.map((r, i) => `<div class="reader-row"><span style="font-weight:bold;color:#FFD700;min-width:24px;text-align:center">${['1.', '2.', '3.'][i] || (i + 1 + '.')}</span><span style="flex:1">${r.student_name}</span><span style="opacity:.7;font-size:.85em">${r.class_name}</span><span style="font-weight:600">${r.book_count} kitap</span></div>`).join('');
        } else trc.innerHTML = '<div class="card-empty">Henuz veri yok</div>';
      } else trc.innerHTML = '<div class="card-empty">Henuz veri yok</div>';

      // Top Class
      if (readers && readers.length && config.show_top_class !== false) {
        const cmap = new Map();
        readers.forEach(r => {
          const s = getArr(r.students);
          const cid = s?.class_id; if (!cid) return;
          const cn = classMap[cid]; if (!cn) return;
          if (!cmap.has(cn)) cmap.set(cn, { total: 0, count: 0 });
          const c = cmap.get(cn); c.total++; c.count++;
        });
        let best = '', bestAvg = 0;
        cmap.forEach((v, k) => { const a = v.total / v.count; if (a > bestAvg) { bestAvg = a; best = k; } });
        if (best) document.getElementById('topClassBox').innerHTML = `<div class="top-class"><div class="label">En Çok Okuyan Sınıf</div><div class="name">${best}</div><div class="avg">Ort. ${Math.round(bestAvg)} kitap</div></div>`;
      }

      // Quiz Footer
      var quizFooter = document.getElementById('quizFooter');
      if (dailyQuiz) {
        var qq = dailyQuiz.quiz_questions;
        var qd = Array.isArray(qq) ? qq[0] : qq;
        if (qd) quizFooter.innerHTML = '❓ Günün Sorusu: ' + qd.question;
      }
      if (quizScores && quizScores.length) {
        quizFooter.innerHTML += ' | 🏆 ' + quizScores.slice(0,3).map(function(s){var cn=getArr(s.classes);return (cn?.name||'')+' '+s.score+'p';}).join(' • ');
      }

      // Gallery
      if (gal && gal.length) {
        galleryIdx = 0;
        renderGallery(gal);
        if (galleryTimer) clearInterval(galleryTimer);
        galleryTimer = setInterval(() => { galleryIdx = (galleryIdx + 1) % gal.length; renderGallery(gal); }, 8000);
      }
    }

    function renderAnnouncements(ann) {
      var panel = document.getElementById('centerPanel');
      if (!ann || !ann.length) {
        panel.innerHTML = '<div style="opacity:.5;font-size:1.2em;text-align:center;padding:40px">Duyuru eklenmemis</div>';
        return;
      }
      var catColors = { duyuru: '#4CAF50', etkinlik: '#FF9800', ayin_Oğrencisi: '#9C27B0', ayin_sinifi: '#2196F3', deneme_liderleri: '#E91E63' };
      var catNames = { duyuru: 'DUYURU', etkinlik: 'ETKINLIK', ayin_Oğrencisi: 'AYIN OğrenciSI', ayin_sinifi: 'AYIN SINIFI', deneme_liderleri: 'DENEME LIDERI' };
      var html = '';
      for (var i = 0; i < ann.length; i++) {
        var s = ann[i];
        html += '<div style="background:var(--card);backdrop-filter:blur(10px);border-radius:12px;border:1px solid var(--border);padding:16px 20px;width:100%">';
        if (s.image_url) html += '<img src="' + s.image_url + '" style="max-width:100%;max-height:200px;border-radius:8px;object-fit:cover;margin:0 auto 10px;display:block">';
        html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">';
        html += '<div style="flex:1;min-width:0"><div style="font-size:1.2em;font-weight:bold;margin-bottom:4px">' + s.title + '</div>';
        if (s.content) html += '<div style="font-size:.95em;opacity:.85;line-height:1.4">' + s.content + '</div>';
        html += '</div>';
        html += '<span style="background:' + (catColors[s.category] || '#4CAF50') + ';padding:4px 12px;border-radius:14px;font-size:.75em;font-weight:600;white-space:nowrap;flex-shrink:0">' + (catNames[s.category] || s.category.toUpperCase()) + '</span>';
        html += '</div></div>';
      }
      panel.innerHTML = html;
    }

    function renderGallery(gal) {
      if (!gal.length) return;
      const g = gal[galleryIdx];
      document.getElementById('galleryThumb').style.display = 'block';
      document.getElementById('galleryImg').src = g.cloudinary_url;
      document.getElementById('galleryCap').textContent = g.caption || '';
      document.getElementById('galleryInfo').textContent = `${galleryIdx + 1} / ${gal.length} - ${g.caption || ''}`;
    }

    // ═══════════════ TIMERS ═══════════════
    function startTimers() {
      clockTimer = setInterval(updateClock, 1000);
      updateClock();
      startAutoScroll();
    }

    // Auto-scroll: asagi in, yukari cik, surekli tekrarla
    function startAutoScroll() {
      const containers = document.querySelectorAll('.auto-scroll');
      const speeds = [0.3, 0.4, 0.25, 0.35, 0.3, 0.28]; // farkli hizlar

      containers.forEach((el, i) => {
        if (!el) return;
        const speed = speeds[i % speeds.length];

        function doScroll(dir) {
          var maxScroll = el.scrollHeight - el.clientHeight;
          if (maxScroll <= 0) return;

          var pos = dir > 0 ? 0 : maxScroll;
          el.scrollTop = pos;

          function step() {
            if (!document.contains(el)) return;
            pos += speed * dir;
            el.scrollTop = pos;

            if (dir > 0 && pos >= maxScroll - 1) {
              // Asagiya indi, 3sn bekle, yukari cik
              setTimeout(function() { doScroll(-1); }, 3000);
              return;
            }
            if (dir < 0 && pos <= 1) {
              // Yukari cikti, 2sn bekle, asagi in
              setTimeout(function() { doScroll(1); }, 2000);
              return;
            }
            requestAnimationFrame(step);
          }
          step();
        }

        // Ilk baslatma - asagi dogru
        setTimeout(function() { doScroll(1); }, 2000 + i * 500);
      });
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      const day = now.getDay();
      const cd = document.getElementById('periodCountdown');
      const ps = document.getElementById('periodStatus');

      if (day === 0 || day === 6) {
        ps.textContent = 'Hafta Sonu';
        cd.textContent = 'Iyi Tatiller!';
        return;
      }

      const mins = now.getHours() * 60 + now.getMinutes();
      let status = 'Ders Dışı';
      let remaining = '';
      let endMins = 0;

      if (allData?.bells) {
        for (const b of allData.bells) {
          const [sh, sm] = b.start_time.split(':').map(Number);
          const [eh, em] = b.end_time.split(':').map(Number);
          const start = sh * 60 + sm;
          const end = eh * 60 + em;
          if (mins >= start && mins <= end) {
            status = b.label + ' devam ediyor';
            endMins = end;
            break;
          }
          if (mins < start && status === 'Ders Dışı') {
            status = b.label + ' baslayacak';
            endMins = start;
          }
          if (mins > end) {
            status = 'Teneffus';
          }
        }
      }

      ps.textContent = status;

      // Countdown
      if (endMins > 0) {
        const diff = endMins - mins;
        const h = Math.floor(diff / 60);
        const m = diff % 60;
        if (h > 0) remaining = h + 's ' + m + 'dk kaldi';
        else if (m > 0) remaining = m + ' dk kaldi';
        else remaining = 'Bitti';
      }
      cd.textContent = remaining;
    }
  </script>
